# JEFQ Consultor — Cloudflare Pages (candidato Cloudflare Workers AI, BORRADOR).
# Declara el binding Workers AI (variable AI) para las Pages Functions.
# El binding también puede configurarse en el dashboard (Workers & Pages →
# proyecto → Settings → Bindings → Add → Workers AI → Variable name "AI").
# Sin este binding, el asistente V2.10 usa solo la ruta sin modelo de lista blanca.
name = "jefq-consultor"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-19"

[ai]
binding = "AI"

# Solo despliegue de prueba (rama asistente-v210): registro empaquetado y
# corpus local mientras D1/Vectorize no existen. Retirar antes de publicar.
[vars]
ASSISTANT_ALLOW_BUNDLED_REGISTER = "1"
ASSISTANT_LOCAL_CORPUS = "1"

# Asistente V2.10: configurar en el despliegue de prueba antes de publicar.
# D1 guarda el registro canónico y la auditoría técnica; Vectorize guarda el
# corpus del sitio para la ruta general. Sin D1, la ruta de precio se cierra.
# [[d1_databases]]
# binding = "DB"
# database_name = "jefq-asistente"
# database_id = "<id-de-d1>"
#
# [[vectorize]]
# binding = "VECTORIZE"
# index_name = "jefq-sitio"
