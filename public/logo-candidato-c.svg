<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 110" role="img" aria-label="JEFQ Consultor — candidato C">
  <!-- CANDIDATO C — "Compacta oscura". Misma geometría del hexágono-"J" EXISTENTE
       (public/favicon.svg y .brand-mark del sitio). Diferencia real frente a A y B:
       lockup para FONDO OSCURO (#0d2540 / #14202e): hexágono con gradiente ámbar
       del sitio, "J" azul oscuro, wordmark "JEFQ" blanco y "CONSULTOR" ámbar
       #ffb43f. El hexágono-"J" solo, sin texto, es la fuente para el favicon
       (legible a 32 y 16 px, ver página de comparación). NO es un activo vivo. -->
  <defs>
    <linearGradient id="amber-c" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd07a"/>
      <stop offset="0.48" stop-color="#ffb43f"/>
      <stop offset="1" stop-color="#ff9f1c"/>
    </linearGradient>
  </defs>
  <path fill="url(#amber-c)" d="M50 2 96 20 89 81 50 108 11 81 4 20Z"/>
  <path fill="#0d2540" d="M37 29h28v39c0 12-7 19-19 19-7 0-13-2-18-7l9-11c3 3 6 4 9 4 4 0 6-2 6-7V42H37Z"/>
  <text x="120" y="64" font-family="Arial, Helvetica, sans-serif" font-size="56" font-weight="800" fill="#ffffff" letter-spacing="1">JEFQ</text>
  <text x="122" y="94" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#ffb43f" letter-spacing="6.5">CONSULTOR</text>
</svg>
